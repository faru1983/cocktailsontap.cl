            state.recetasMap.get(receta.Coctel).push(receta);

            formatNumber: (num) => Math.round(num * 100) / 100,

                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>${headers.map(h => `<th class="px-4 py-2 text-left text-xs md:text-sm font-bold text-gray-600 uppercase tracking-wider">${h}</th>`).join('')}</tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${rows.join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        };

        const tabManager = {
            init() {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const tabId = e.currentTarget.dataset.tab;
                        this.switchTab(tabId);
                    });
                });
            },

            switchTab(tabId) {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    const isActive = btn.dataset.tab === tabId;
                    btn.classList.toggle('bg-white', isActive);
                    btn.classList.toggle('text-blue-600', isActive);
                    btn.classList.toggle('border-b-2', isActive);
                    btn.classList.toggle('border-blue-600', isActive);
                    btn.classList.toggle('text-gray-500', !isActive);
                });

                document.querySelectorAll('.tab-content').forEach(content => {
                    const isActive = content.id === `tab-${tabId}`;
                    content.classList.toggle('block', isActive);
                    content.classList.toggle('hidden', !isActive);
                });
            }
        };

        const calculadora = {
            currentShoppingList: {},

            init() {
                this.currentShoppingList = {};
                this.currentProductionRequest = {};
                this.renderForm();
                document.getElementById('btn-calcular').addEventListener('click', () => this.calculate());
                document.getElementById('btn-limpiar').addEventListener('click', () => this.clear());
            },

            renderForm() {
                const form = document.getElementById('pedido-form');
                form.innerHTML = state.cocteles.map(coctel => `
                    <div class="flex flex-col">
                        <label for="litros-${coctel}" class="mb-1.5 text-sm font-medium text-gray-700">${coctel}</label>
                        <input 
                            type="number" 
                            id="litros-${coctel}" 
                            data-coctel="${coctel}" 
                            placeholder="Litros (ej: 10)" 
                            min="0"
                            step="0.1"
                            class="border border-gray-300 rounded-md p-2 shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        >
                    </div>
                `).join('');
            },

            calculate() {
                const inputs = document.querySelectorAll('#pedido-form input');
                const shoppingList = {};
                const productionRequest = {};
                inputs.forEach(input => {
                    const litros = parseFloat(input.value) || 0;
                    if (litros <= 0) return;

                    const coctel = input.dataset.coctel;
                    productionRequest[coctel] = litros;
                    const factor = litros / CONFIG.BASE_LITROS;
                    const ingredientes = state.recetasMap.get(coctel) || [];

                    ingredientes.forEach(({ Ingrediente, Unidad, Cantidad_Base_5L, Categoria }) => {
                        const key = Ingrediente;
                        if (!shoppingList[key]) {
                            shoppingList[key] = { cantidad: 0, unidad: Unidad, categoria: Categoria };
                        }
                        shoppingList[key].cantidad += Cantidad_Base_5L * factor;
                    });
                });

                this.currentShoppingList = shoppingList;
                this.currentProductionRequest = productionRequest;
                this.renderResults(shoppingList);
            },

            _getGroupedShoppingList(shoppingList) {
                const porCategoria = {};
                Object.entries(shoppingList).forEach(([ingrediente, data]) => {
                    const cat = data.categoria;
                    if (!porCategoria[cat]) porCategoria[cat] = [];
                    porCategoria[cat].push({ ingrediente, ...data });
                });
                const categoriasOrdenadas = CONFIG.ORDEN_CATEGORIAS.filter(cat => porCategoria[cat]);
                return { porCategoria, categoriasOrdenadas };
            },

            renderResults(shoppingList) {
                const container = document.getElementById('resultado-calculadora');
                
                if (Object.keys(shoppingList).length === 0) {
                    container.innerHTML = '<p class="text-center text-gray-600 font-medium">No has ingresado ninguna producción para calcular.</p>';
                    return;
                }

                const { porCategoria, categoriasOrdenadas } = this._getGroupedShoppingList(shoppingList);

                let html = `
                    <h2 class="text-2xl font-semibold text-gray-800 mb-5">Lista de Producción Total</h2>
                `;
                
                categoriasOrdenadas.forEach(categoria => {
                    const items = porCategoria[categoria].sort((a, b) => a.ingrediente.localeCompare(b.ingrediente));
                    
                    html += `
                        <div class="mb-6">
                            <h3 class="text-lg font-semibold text-gray-700 mb-3 pb-2 border-b-2 border-blue-500">${categoria}</h3>
                            ${utils.createTable(
                                ['Ingrediente', 'Cantidad Total', 'Unidad'],
                                items.map(item => `
                                    <tr>
                                        <td class="px-4 py-3 text-xs md:text-sm font-medium text-gray-900">${item.ingrediente}</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-xs md:text-sm text-gray-700">${utils.formatNumber(item.cantidad)}</td>
                                        <td class="px-4 py-3 whitespace-nowrap text-xs md:text-sm text-gray-700">${item.unidad}</td>
                                    </tr>
                                `)
                            )}
                        </div>
                    `;
                });

                html += `
                    <div class="my-4 pt-4 border-t border-gray-200">
                        <button id="btn-whatsapp" type="button" class="w-full flex items-center justify-center gap-2 bg-green-500 text-white font-bold py-3 px-6 rounded-lg shadow hover:bg-green-600 transition duration-200">
                            <i class="fa-brands fa-whatsapp h-5 w-5"></i>
                            Enviar por WhatsApp
                        </button>
                    </div>
                `;

                container.innerHTML = html;

                document.getElementById('btn-whatsapp').addEventListener('click', () => this.sendToWhatsApp());
            },

            clear() {
                document.querySelectorAll('#pedido-form input').forEach(input => input.value = '');
                document.getElementById('resultado-calculadora').innerHTML = '';
                this.currentShoppingList = {};
                this.currentProductionRequest = {};
            },

            sendToWhatsApp() {
                const shoppingList = this.currentShoppingList;
                const productionRequest = this.currentProductionRequest;

                if ((!shoppingList || Object.keys(shoppingList).length === 0) &&
                    (!productionRequest || Object.keys(productionRequest).length === 0)) {
                    return;
                }
                
                let message = '*Resumen de Producción (Litros)*\n\n';

                if (productionRequest && Object.keys(productionRequest).length > 0) {
                    Object.entries(productionRequest).forEach(([coctel, litros]) => {
                        message += `- ${coctel}: ${utils.formatNumber(litros)} Lts\n`;
                    });
                } else {
                    message += "No se ingresó producción.\n";
                }

                message += '\n----------------------------------\n\n';
                message += '*Lista de Ingredientes Total*\n\n';
                
                if (!shoppingList || Object.keys(shoppingList).length === 0) {
                    message += "No se generaron ingredientes.";
                } else {
                    const { porCategoria, categoriasOrdenadas } = this._getGroupedShoppingList(shoppingList);
                    categoriasOrdenadas.forEach(categoria => {
                        message += `*${categoria}*\n`;
                        const items = porCategoria[categoria].sort((a, b) => a.ingrediente.localeCompare(b.ingrediente));
                        
                        items.forEach(item => {
                            message += `- ${item.ingrediente}: ${utils.formatNumber(item.cantidad)} ${item.unidad}\n`;
                        });
                        message += '\n';
                    });
                }

                const encodedMessage = encodeURIComponent(message);
                const whatsappURL = `https://wa.me/?text=${encodedMessage}`;
                window.open(whatsappURL, '_blank');
            }
        };

        const recetario = {
            init() {
                this.renderSelector();
                document.getElementById('selector-coctel').addEventListener('change', (e) => this.showRecipe(e.target.value));
            },

            renderSelector() {
                const selector = document.getElementById('selector-coctel');
                selector.innerHTML = '<option value="">-- Elige un cóctel --</option>' +
                    state.cocteles.map(coctel => `<option value="${coctel}">${coctel}</option>`).join('');
            },

            showRecipe(coctel) {
                const container = document.getElementById('receta-container');
                
                if (!coctel) {
                    container.innerHTML = '<p class="text-center text-gray-500">Por favor, selecciona un cóctel.</p>';
                    return;
                }

                const ingredientes = state.recetasMap.get(coctel) || [];
                
                const html = `
                    <h3 class="text-xl font-semibold text-gray-800 mb-4">Receta Base (5 Litros)</h3>
                    ${utils.createTable(
                        ['Ingrediente', 'Cantidad', 'Unidad'],
                        ingredientes.map(ing => `
                            <tr>
                                <td class="px-4 py-3 text-xs md:text-sm font-medium text-gray-900">${ing.Ingrediente}</td>
                                <td class="px-4 py-3 whitespace-nowrap text-xs md:text-sm text-gray-700">${ing.Cantidad_Base_5L}</td>
                                <td class="px-4 py-3 whitespace-nowrowrap text-xs md:text-sm text-gray-700">${ing.Unidad}</td>
                            </tr>
                        `)
                    )}
                `;
                
                container.innerHTML = html;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            tabManager.init();
            calculadora.init();
            recetario.init();
        });
    </script>
</body>
</html>
